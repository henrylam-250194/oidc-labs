name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v3
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.x'
  
        - name: Install pre-commit
          run: |
            python -m pip install --upgrade pip
            pip install pre-commit
  
        - name: Install tools (terraform, tflint, terraform-docs)
          run: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            
            # Install Terraform
            curl -fsSL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip -o terraform.zip
            unzip terraform.zip
            sudo mv terraform /usr/local/bin/
            
            # Install tflint
            curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
  
            # Install terraform-docs
            curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
            tar -xzf terraform-docs.tar.gz
            sudo mv terraform-docs /usr/local/bin/
  
        - name: Run pre-commit
          run: pre-commit run --all-files

  terraform-plan:
    name: Terraform Plan for ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: pre-commit

    strategy:
      matrix:
        env: [dev]

    defaults:
      run:
        working-directory: aws-infra/env/${{ matrix.env }}

    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509403202865:role/oidc-test
          role-session-name: GitHubActionsSession
          aws-region: ap-southeast-1

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color